name: PWA and database checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: baxi-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pbaxi-ci-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      BAXI_DB_HOST: 127.0.0.1
      BAXI_DB_PORT: 3306
      BAXI_DB_USER: baxi
      BAXI_DB_PASSWORD: baxi-ci-app-only
      BAXI_DEMO_MODE: "true"
      BAXI_RUN_INTEGRATION: "1"
      BAXI_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Initialize disposable schemas with a restricted application user
        env:
          MYSQL_PWD: baxi-ci-only
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -uroot < db/main.sql
          mysql --protocol=TCP -h 127.0.0.1 -uroot < db/migrations/003-pricing.sql
          mysql --protocol=TCP -h 127.0.0.1 -uroot < db/migrations/003-pricing.sql
          mysql --protocol=TCP -h 127.0.0.1 -uroot -e "CREATE USER 'baxi'@'%' IDENTIFIED BY 'baxi-ci-app-only';"
          mysql --protocol=TCP -h 127.0.0.1 -uroot < db/local-grants.sql
          python scripts/seed_demo.py
      - name: Python checks and real MySQL regression tests
        run: |
          ruff check src scripts tests
          ruff format --check src scripts tests
          python -m pytest -q
      - name: Build and exercise the production PWA
        run: |
          npm run format:check
          npm run build
          python -m uvicorn api:app --app-dir src --host 127.0.0.1 --port 8000 > /tmp/baxi-api.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break || sleep 1; done
          npm run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: test-results/
